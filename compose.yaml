services:
  gold-digger:
    build:
      context: .
      dockerfile: Dockerfile
    image: gold-digger:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      IDX_CAPITAL: "50000000"
      IDX_DATA: /app/data/idx_daily.csv
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
