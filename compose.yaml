services:
  gold-digger:
    build: .
    image: gold-digger:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      IDX_CAPITAL: "50000000"
      IDX_DATA: /app/data/idx_daily.csv
      GOLD_RESULTS: /app/results/gold
    volumes:
      - ./data:/app/data:ro
      - ./results:/app/results:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  idx-sync:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    image: gold-digger:local
    build: .
    restart: unless-stopped
    command: ["python", "-m", "idx_monitor.scheduler"]
    environment:
      IDX_DATA: /app/data/idx_daily.csv
      IDX_SYNC_SECONDS: "21600"
      IDX_PROVIDER: "${IDX_PROVIDER:-tradingview}"
    volumes:
      - ./data:/app/data
  gold-sync:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    image: gold-digger:local
    build: .
    restart: unless-stopped
    command: ["python", "-m", "idx_monitor.gold_sync"]
    environment:
      GOLD_DATA: /app/data/xau_h1.csv
      GOLD_RESULTS: /app/results/gold
      GOLD_SYNC_SECONDS: "21600"
      GOLD_PROVIDER: "${GOLD_PROVIDER:-tradingview}"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
